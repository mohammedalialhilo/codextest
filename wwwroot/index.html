<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Info Landing Page</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg), #e6eefc);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: min(720px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
    }

    p {
      line-height: 1.6;
      color: var(--muted);
    }

    .cta {
      display: inline-block;
      margin-top: 1rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      padding: 0.7rem 1rem;
    }

    .meta {
      margin-top: 1.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Our Info Landing Page</h1>
    <p>
      This simple landing page is built with <strong>C#</strong> and <strong>HTML</strong>.
      It is designed to share key information quickly and clearly.
    </p>
    <p>
      You can customize this page with your company details, services, and contact links.
    </p>
    <a class="cta" href="/api/info">View API Info</a>
    <div class="meta">Contact: hello@example.com</div>
  </main>
</body>
</html>
